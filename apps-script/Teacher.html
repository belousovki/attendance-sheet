<!DOCTYPE html>
<html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:Arial,sans-serif;margin:0;background:#f8f9fa;color:#202124}.wrap{max-width:520px;margin:0 auto;padding:18px 14px 30px}.card{background:#fff;border:1px solid #dadce0;border-radius:12px;padding:16px;margin-bottom:12px}h1{font-size:22px;margin:0 0 4px}.muted{color:#5f6368;font-size:13px}label{display:block;font-size:13px;margin-top:10px;color:#5f6368}select,input,textarea,button{width:100%;box-sizing:border-box;padding:13px;font-size:16px;margin-top:8px;font-family:inherit}textarea{min-height:70px;resize:vertical}button{cursor:pointer}.primary{font-weight:700}.danger{margin-top:18px}.code{font-size:42px;font-weight:700;letter-spacing:5px;text-align:center;margin:10px 0}.count{font-size:20px;text-align:center;margin:8px 0}.row{display:flex;gap:8px}.row button{flex:1}</style></head>
<body><div class="wrap">
<div class="card"><h1 id="appTitle">Пульт преподавателя</h1><div class="muted">Работает и на телефоне</div></div>
<div id="setup" class="card"><label>Формат</label><select id="mode"><option>Очно</option><option>Дистанционно</option></select><label>Тип занятия</label><select id="lessonType"></select><label>Тема (необязательно)</label><input id="topic" placeholder="Тема занятия"><label>Заметка (необязательно)</label><textarea id="notes" placeholder="Краткая заметка преподавателя"></textarea><button class="primary" onclick="startLesson()">НАЧАТЬ ЗАНЯТИЕ</button><button onclick="syncStudents()">Синхронизировать состав</button></div>
<div id="active" style="display:none"><div class="card"><div id="lessonInfo"></div><div class="count">Отметились: <b id="marked">0</b> / <span id="total">0</span></div></div><div class="card"><button id="regularBtn" class="primary" onclick="startCheck('regular')">ПРОВЕРИТЬ ПРИСУТСТВИЕ</button><button id="lateBtn" onclick="startCheck('late')">КОД ДЛЯ ОПОЗДАВШЕГО</button><div id="codeBox" style="display:none"><div class="muted" id="checkLabel"></div><div class="code" id="code">—</div><div style="text-align:center" id="timer"></div><div class="muted" style="text-align:center" id="cycle"></div><button class="danger" onclick="stopCheck()">ОСТАНОВИТЬ ГЕНЕРАЦИЮ КОДОВ</button></div></div><div class="card row"><button onclick="openDisplay()">Дисплей</button><button onclick="openSheet()">Журнал</button></div><div class="card"><button onclick="syncStudents()">Синхронизировать состав</button><button class="danger" onclick="finishLesson()">ЗАВЕРШИТЬ ЗАНЯТИЕ</button></div></div><div id="msg" class="muted"></div></div>
<script>
const TEACHER_KEY=<?!= JSON.stringify(teacherKey) ?>;let currentState=null;
function msg(t){document.getElementById('msg').textContent=t||''}function setBusy(v){['regularBtn','lateBtn'].forEach(id=>{const x=document.getElementById(id);if(x)x.disabled=!!v})}
function refresh(){google.script.run.withSuccessHandler(render).withFailureHandler(e=>msg(e.message||String(e))).teacherGetState(TEACHER_KEY)}
function fillTypes(types){const s=document.getElementById('lessonType'),old=s.value;s.innerHTML='';(types||[]).forEach(t=>{const o=document.createElement('option');o.value=t.name;o.textContent=t.name;s.appendChild(o)});if(old&&[...s.options].some(o=>o.value===old))s.value=old}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function render(s){currentState=s||{};document.getElementById('appTitle').textContent=(s.discipline||'Дисциплина')+' — пульт преподавателя';fillTypes(s.lessonTypes||[]);const has=!!s.lesson;document.getElementById('setup').style.display=has?'none':'block';document.getElementById('active').style.display=has?'block':'none';if(!has)return;let li='<b>'+s.lesson.dateDisplay+'</b><br>'+(s.lesson.lessonType||'');if(s.lesson.typeNumber!==''&&s.lesson.typeNumber!=null)li+=' №'+s.lesson.typeNumber;li+='<br>'+s.lesson.mode;if(s.lesson.topic)li+='<br><span class="muted">'+esc(s.lesson.topic)+'</span>';document.getElementById('lessonInfo').innerHTML=li;document.getElementById('marked').textContent=s.marked;document.getElementById('total').textContent=s.total;const c=s.check||{},box=document.getElementById('codeBox');if(c.active){box.style.display='block';document.getElementById('checkLabel').textContent=c.kind==='late'?'Код для опоздавшего':'Проверка присутствия';document.getElementById('code').textContent=c.code;document.getElementById('cycle').textContent='Код №'+c.cycle+' · смена каждые '+c.seconds+' сек.';updateTimer(c.expiresAt)}else box.style.display='none'}
function updateTimer(x){document.getElementById('timer').textContent='Осталось: '+Math.max(0,Math.ceil((Number(x)-Date.now())/1000))+' сек.'}
function startLesson(){google.script.run.withSuccessHandler(r=>{msg(r.message);render(r.state||{})}).withFailureHandler(e=>msg(e.message||String(e))).teacherStartLesson(TEACHER_KEY,{mode:document.getElementById('mode').value,lessonType:document.getElementById('lessonType').value,topic:document.getElementById('topic').value,notes:document.getElementById('notes').value})}
function startCheck(kind){msg('Команда отправлена. Запускаю генерацию…');setBusy(true);google.script.run.withSuccessHandler(r=>{setBusy(false);msg(r.message);render(r.state||{})}).withFailureHandler(e=>{setBusy(false);msg(e.message||String(e))}).teacherStartCheck(TEACHER_KEY,kind)}
function stopCheck(){msg('Останавливаю генерацию…');setBusy(true);google.script.run.withSuccessHandler(r=>{setBusy(false);msg('Генерация остановлена.');render(r.state||{})}).withFailureHandler(e=>{setBusy(false);msg(e.message||String(e))}).teacherStopCheck(TEACHER_KEY)}
function finishLesson(){const auto=currentState&&currentState.autoAbsentOnFinish,p=currentState?currentState.absentPoints:0;if(!confirm(auto?'Завершить занятие? Без отметки будет записано '+p+'.':'Завершить занятие? Пустые отметки останутся пустыми.'))return;google.script.run.withSuccessHandler(r=>{msg(r.message);refresh()}).withFailureHandler(e=>msg(e.message||String(e))).teacherFinishLesson(TEACHER_KEY)}
function syncStudents(){google.script.run.withSuccessHandler(r=>{msg(r.message);render(r.state||currentState||{})}).withFailureHandler(e=>msg(e.message||String(e))).teacherSyncStudents(TEACHER_KEY)}
function openDisplay(){if(currentState&&currentState.links&&currentState.links.displayUrl)window.open(currentState.links.displayUrl,'_blank')}function openSheet(){if(currentState&&currentState.links&&currentState.links.sheetUrl)window.open(currentState.links.sheetUrl,'_blank')}
setInterval(()=>{if(currentState&&currentState.check&&currentState.check.active)updateTimer(currentState.check.expiresAt)},250);setInterval(refresh,5000);refresh();
</script></body></html>
