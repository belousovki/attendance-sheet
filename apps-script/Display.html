<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
  ></script>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #202124;
    }

    .wrap {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .inner {
      width: min(1000px, 94vw);
    }

    h1 {
      font-size: clamp(
        28px,
        4vw,
        52px
      );
      margin: 0 0 16px;
    }

    #code {
      font-size: clamp(
        70px,
        13vw,
        150px
      );
      font-weight: 700;
      letter-spacing: .12em;
      margin: 20px 0;
    }

    #timer {
      font-size: clamp(
        24px,
        4vw,
        44px
      );
    }

    #count {
      font-size: clamp(
        18px,
        2.5vw,
        30px
      );
      margin-top: 20px;
      color: #5f6368;
    }

    #idle {
      font-size: clamp(
        28px,
        4vw,
        48px
      );
      color: #5f6368;
    }

    #qr {
      display: flex;
      justify-content: center;
      margin-top: 24px;
    }

    #qr img,
    #qr canvas {
      width: 160px !important;
      height: 160px !important;
    }

    .small {
      color: #5f6368;
      margin-top: 8px;
    }
  </style>
</head>

<body>
<div class="wrap">
  <div class="inner">
    <h1 id="title">Дисциплина</h1>

    <div
      id="active"
      style="display:none"
    >
      <div>
        ПРОВЕРКА ПРИСУТСТВИЯ
      </div>

      <div id="code">—</div>

      <div id="timer"></div>

      <div id="cycle"></div>

      <div id="count"></div>
    </div>

    <div id="idle">
      Проверка присутствия
      сейчас не проводится
    </div>

    <div id="qr"></div>

    <div
      class="small"
      id="hint"
    ></div>
  </div>
</div>

<script>
let qrBuilt = false;
let lastState = null;
let localCheck = null;

function buildQr(url) {
  if (
    !url ||
    qrBuilt ||
    typeof QRCode === 'undefined'
  ) return;

  qrBuilt = true;

  new QRCode(
    document.getElementById('qr'),
    {
      text: url,
      width: 160,
      height: 160
    }
  );

  document.getElementById('hint')
    .textContent =
      'QR ведёт на постоянную страницу отметки';
}

function render(s) {
  lastState = s;

  document.getElementById('title')
    .textContent =
      s.discipline +
      (
        s.lesson
          ? ' · ' +
            s.lesson.dateDisplay
          : ''
      );

  buildQr(
    s.links &&
    s.links.studentUrl
  );

  const check = s.check || {};

  document.getElementById('active')
    .style.display =
      check.active
        ? 'block'
        : 'none';

  document.getElementById('idle')
    .style.display =
      check.active
        ? 'none'
        : 'block';

  if (!check.active) return;

  document.getElementById('code')
    .textContent =
      check.code;

  document.getElementById('cycle')
    .textContent =
      'Код ' +
      check.cycle +
      ' из ' +
      check.totalCycles;

  document.getElementById('count')
    .textContent =
      'Отметились: ' +
      s.marked +
      ' из ' +
      s.total;

  updateTimer();
}

function updateTimer() {
  if (
    !lastState ||
    !lastState.check ||
    !lastState.check.active
  ) return;

  const ms =
    Math.max(
      0,
      Number(
        lastState.check.expiresAt
      ) -
      Date.now()
    );

  document.getElementById('timer')
    .textContent =
      'Осталось ' +
      Math.ceil(ms / 1000) +
      ' сек.';
}

function refresh() {
  google.script.run
    .withSuccessHandler(render)
    .withFailureHandler(
      () => {}
    )
    .getDisplayState();
}

setInterval(
  updateTimer,
  200
);

setInterval(
  refresh,
  1000
);

refresh();
</script>
</body>
</html>
